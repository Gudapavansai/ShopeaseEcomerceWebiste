<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prata&amp;display=swap');
    .logo-text { font-family: 'Prata', serif; font-weight: 400; }
  </style>
  
  <!-- New Icon based on user upload: Bag with circle -->
  <g transform="translate(10, 5) scale(0.9)">
      <!-- Handle -->
      <path d="M18 15 Q25 5 32 15" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Bag Body -->
      <path d="M12 15 L38 15 L36 45 L14 45 Z" fill="none" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Center Dot -->
      <circle cx="25" cy="30" r="3.5" fill="#374151"/>
  </g>

  <!-- Text -->
  <text x="60" y="40" font-size="36" fill="#374151" letter-spacing="3" class="logo-text">SHOPEASE</text>
</svg>
